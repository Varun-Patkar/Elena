[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elena-agent"
version = "0.1.0"
description = "A local-first personal agent with an immutable harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.8,<7",
]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
elena-desktop = "elena.desktop:main"
elena-runtime = "elena.runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elena"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
